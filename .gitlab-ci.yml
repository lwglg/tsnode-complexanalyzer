# GitLab CI/CD pipeline for tsnode-complexanalyzer

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^(main|master|develop)$/

variables:
  NODE_VERSION: '22'
  PNPM_STORE_DIR: '$CI_PROJECT_DIR/.pnpm-store'

default:
  image: node:${NODE_VERSION}-bookworm
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
      - node_modules
  before_script:
    - corepack enable
    - corepack prepare pnpm@12 --activate
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile

stages:
  - quality
  - build

typecheck:
  stage: quality
  script:
    - pnpm typecheck

lint:
  stage: quality
  script:
    - pnpm lint
    - pnpm format:check

test:
  stage: quality
  script:
    - pnpm test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 14 days

build:
  stage: build
  needs: [typecheck, lint, test]
  script:
    - pnpm build
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
